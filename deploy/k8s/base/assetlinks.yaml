# Served at https://esper.media/.well-known/assetlinks.json (docs/SERVER.md §5, §9).
# Public by design. Replace the placeholder with the `assetlinks` row of a
# build-apk run summary (docs/BETA_SETUP_LEVI.md step 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: esper-assetlinks
  namespace: esper
data:
  assetlinks.json: |
    [
      {
        "relation": [
          "delegate_permission/common.get_login_creds"
        ],
        "target": {
          "namespace": "android_app",
          "package_name": "com.esper.app",
          "sha256_cert_fingerprints": [
            "REPLACE:WITH:RELEASE:CERT:SHA256:FINGERPRINT"
          ]
        }
      }
    ]
