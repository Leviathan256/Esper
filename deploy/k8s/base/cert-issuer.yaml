# Let's Encrypt via Cloudflare DNS-01: with this and the host firewall, the only
# Cloudflare-specific parts (ADR-0001). The token is scoped to Zone:DNS:Edit on
# esper.media and lives in the Secret `cloudflare-api-token` (key `api-token`)
# in the `cert-manager` namespace, where a ClusterIssuer reads it; created on
# the host, never in git.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      - selector:
          dnsZones: [esper.media]
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
