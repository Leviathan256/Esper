name: Deploy server

# Tests the Rust server, pushes its image to GHCR tagged by commit, then joins
# the tailnet and applies deploy/k8s to the k3s host (docs/SERVER.md §9).
# Never touches the rolling "nightly" tag or any release. Until the Tailscale
# secrets exist the deploy job says it skipped and stays green.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "content/**"
      - "deploy/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/leviathan256/esper-server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: esper
          POSTGRES_DB: esper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESPER_TEST_DB_URL: postgres://postgres:esper@localhost:5432/esper_test
      SQLX_OFFLINE: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only ever tagged by commit: the cluster runs exactly the commit that was tested.
      - name: Build and push (linux/amd64, linux/arm64)
        run: >-
          docker buildx build -f server/Dockerfile
          --platform linux/amd64,linux/arm64
          --tag "${IMAGE}:${GITHUB_SHA}" --push .

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secrets cannot appear in `if:`; an empty value means the secret is not set.
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
    steps:
      - name: Note skipped deploy
        if: env.TS_OAUTH_CLIENT_ID == ''
        run: |
          echo "::notice::deploy skipped: no Tailscale credentials"
          echo "deploy skipped: no Tailscale credentials (TS_OAUTH_CLIENT_ID is not set)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Join the tailnet
        if: env.TS_OAUTH_CLIENT_ID != ''
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write kubeconfig
        if: env.TS_OAUTH_CLIENT_ID != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.ESPER_KUBECONFIG }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.kube
          printf '%s\n' "${KUBECONFIG_DATA}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        if: env.TS_OAUTH_CLIENT_ID != ''
        working-directory: deploy/k8s/overlays/prod
        run: |
          set -euo pipefail
          kustomize edit set image "${IMAGE}:${GITHUB_SHA}"
          kubectl apply -k .
          kubectl -n esper rollout status deploy/esper-server --timeout=5m

      - name: Check https://esper.media/healthz
        if: env.TS_OAUTH_CLIENT_ID != ''
        run: |
          set -euo pipefail
          # Retries cover the first certificate issuance and Cloudflare reaching the new pod.
          body="$(curl -fsS --retry 20 --retry-delay 15 --retry-all-errors https://esper.media/healthz)"
          [ "$body" = ok ] || { echo "healthz answered: $body"; exit 1; }
          echo "deployed ${GITHUB_SHA}: https://esper.media/healthz is ok" >> "${GITHUB_STEP_SUMMARY}"

      - name: Cluster state on failure
        if: failure() && env.TS_OAUTH_CLIENT_ID != ''
        run: |
          kubectl -n esper get pods,ingress,certificate || true
          kubectl -n esper logs deploy/esper-server --tail=100 || true
