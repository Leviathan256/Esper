name: Signing fingerprint

# Prints the release cert fingerprint straight from the keystore secret, for
# pages/assetlinks.json and ESPER_RP_ORIGINS, without waiting for a build.
# Run it from the Actions tab. It prints public values only (no secrets).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Print fingerprint
        env:
          KEYSTORE_BASE64: ${{ secrets.ESPER_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ESPER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ESPER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::ESPER_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/ks.jks"
          out="$(bash pages/fingerprint.sh "${RUNNER_TEMP}/ks.jks" "${KEY_ALIAS:-esper}")"
          rm -f "${RUNNER_TEMP}/ks.jks"
          echo "${out}"
          { echo "### Signing fingerprint"; echo '```'; echo "${out}"; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
