name: CI

# Every player-dispatched PR gets built before anyone merges it, through the
# exact same composite action the release workflows use — so this check also
# proves the release path still works, not just that the code compiles.
#
# The artifact is a signed release APK, which means you can sideload a PR build
# straight onto a phone and it will install over your existing Esper.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Baked into BuildConfig.SERVER_URL; unset = blank = "Server not configured".
      ESPER_SERVER_URL: ${{ vars.ESPER_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version metadata
        id: version
        run: bash ./scripts/ci/version.sh nightly

      - name: Build APK
        id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.version-name }}
          version-code: ${{ steps.version.outputs.version-code }}
          asset-name: Esper-pr.apk
          channel: pr
          keystore-base64: ${{ secrets.ESPER_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ESPER_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ESPER_KEY_ALIAS }}
          key-password: ${{ secrets.ESPER_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esper-pr-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.apk-path }}
            ${{ steps.build.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 14

  # Pure-JVM game engine: every rule, dice roll, stat formula, grid computation
  # and content file is validated here, on every PR, with no Android SDK and no
  # emulator. Malformed job or monster JSON fails this job rather than a player's
  # phone (docs/GAME_DESIGN.md, "Jobs: a data pipeline", rule 3).
  #
  # Deliberately WITHOUT --configure-on-demand, unlike local runs: google() is
  # reachable here, so the plain invocation additionally proves :app still
  # configures after the plugin-version move into settings.gradle.kts.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # :server's API tests run against a real Postgres (they skip without this URL).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: esper
          POSTGRES_DB: esper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESPER_TEST_DB_URL: jdbc:postgresql://localhost:5432/esper_test?user=postgres&password=esper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `gradle`, not ./gradlew — no wrapper jar is committed. setup-gradle
      # installs the pinned version, matching the composite build action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # Only the default branch writes the shared cache; every other ref reads
          # it. Stops concurrent runs from evicting each other's entries.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          add-job-summary: on-failure

      - name: Run engine and server tests
        run: gradle :engine:test :server:test --console=plain

  # Rust server (docs/SERVER.md §11): format, lint and test against Postgres 18,
  # then build the multi-arch image and smoke-test the amd64 one against the
  # same database, up and down. `cargo test` loads content/ through the Rust
  # loader, so a content change must pass both this job and the engine job's
  # ShippedContentTest while the frozen Kotlin engine exists.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: esper
          POSTGRES_DB: esper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESPER_TEST_DB_URL: postgres://postgres:esper@localhost:5432/esper_test
      # Build from the committed .sqlx/ query data, never a live database.
      SQLX_OFFLINE: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, linux/arm64)
        working-directory: .
        run: docker buildx build -f server/Dockerfile --platform linux/amd64,linux/arm64 .

      - name: Smoke-test the amd64 image
        working-directory: .
        run: |
          set -euo pipefail
          docker buildx build -f server/Dockerfile --platform linux/amd64 --load -t esper-server:ci .
          docker run -d --name esper --network host \
            -e ESPER_BIND=127.0.0.1:8080 \
            -e ESPER_DB_URL=postgres://postgres:esper@127.0.0.1:5432/esper_test \
            esper-server:ci
          body="$(curl -fsS --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8080/healthz)"
          [ "$body" = ok ] || { echo "healthz with the database up: $body"; exit 1; }
          docker stop "${{ job.services.postgres.id }}"
          code="$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)"
          [ "$code" = 503 ] || { echo "healthz with the database down: $code"; exit 1; }

      - name: Server log
        if: always()
        working-directory: .
        run: docker logs esper 2>&1 || true
