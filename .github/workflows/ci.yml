name: CI

# Every player-dispatched PR gets compiled before anyone merges it, and the
# resulting APK is attached to the run so you can sideload a change and try it
# on a real phone before it ships to everyone.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # Read-only: only the release builds on main populate the shared cache.
          cache-read-only: true

      # Debug rather than release: no signing key needed, and it is the
      # quickest way to answer the only question a PR check needs to answer.
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --build-cache --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esper-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
