name: CI

# Every player-dispatched PR gets built before anyone merges it, through the
# exact same composite action the release workflows use — so this check also
# proves the release path still works, not just that the code compiles.
#
# The artifact is a signed release APK, which means you can sideload a PR build
# straight onto a phone and it will install over your existing Esper.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version metadata
        id: version
        run: bash ./scripts/ci/version.sh nightly

      - name: Build APK
        id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.version-name }}
          version-code: ${{ steps.version.outputs.version-code }}
          asset-name: Esper-pr.apk
          channel: pr
          keystore-base64: ${{ secrets.ESPER_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ESPER_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ESPER_KEY_ALIAS }}
          key-password: ${{ secrets.ESPER_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esper-pr-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.apk-path }}
            ${{ steps.build.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 14

  # Pure-JVM game engine: every rule, dice roll, stat formula, grid computation
  # and content file is validated here, on every PR, with no Android SDK and no
  # emulator. Malformed job or monster JSON fails this job rather than a player's
  # phone (docs/GAME_DESIGN.md, "Jobs: a data pipeline", rule 3).
  #
  # Deliberately WITHOUT --configure-on-demand, unlike local runs: google() is
  # reachable here, so the plain invocation additionally proves :app still
  # configures after the plugin-version move into settings.gradle.kts.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `gradle`, not ./gradlew — no wrapper jar is committed. setup-gradle
      # installs the pinned version, matching the composite build action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          # Only the default branch writes the shared cache; every other ref reads
          # it. Stops concurrent runs from evicting each other's entries.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
          add-job-summary: on-failure

      - name: Run engine tests
        run: gradle :engine:test --console=plain
