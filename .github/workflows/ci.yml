name: CI

# Every player-dispatched PR gets built before anyone merges it, through the
# exact same composite action the release workflows use — so this check also
# proves the release path still works, not just that the code compiles.
#
# The artifact is a signed release APK, which means you can sideload a PR build
# straight onto a phone and it will install over your existing Esper.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version metadata
        id: version
        run: bash ./scripts/ci/version.sh nightly

      - name: Build APK
        id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.version-name }}
          version-code: ${{ steps.version.outputs.version-code }}
          asset-name: Esper-pr.apk
          channel: pr
          keystore-base64: ${{ secrets.ESPER_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ESPER_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ESPER_KEY_ALIAS }}
          key-password: ${{ secrets.ESPER_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esper-pr-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.apk-path }}
            ${{ steps.build.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 14
