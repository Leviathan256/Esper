name: Release (nightly for Obtainium)

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the APK, so don't spend a build on them.
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch: {}

permissions:
  contents: write

# Only the newest commit on main matters — cancel anything already in flight so
# the freshest code reaches the release first.
concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Shallow: version.sh only needs HEAD's timestamp and sha.
        with:
          fetch-depth: 1

      - name: Compute version metadata
        id: version
        run: bash ./scripts/ci/version.sh nightly

      - name: Build APK
        id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.version-name }}
          version-code: ${{ steps.version.outputs.version-code }}
          asset-name: ${{ steps.version.outputs.asset-name }}
          channel: nightly

      - name: Create/update rolling nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.apk-path }}
            ${{ steps.build.outputs.manifest-path }}
