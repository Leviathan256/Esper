name: Release (versioned for Obtainium)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version metadata
        id: version
        run: bash ./scripts/ci/version.sh stable "${GITHUB_REF_NAME}"

      - name: Build APK
        id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.version-name }}
          version-code: ${{ steps.version.outputs.version-code }}
          asset-name: ${{ steps.version.outputs.asset-name }}
          channel: stable
          keystore-base64: ${{ secrets.ESPER_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ESPER_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ESPER_KEY_ALIAS }}
          key-password: ${{ secrets.ESPER_KEY_PASSWORD }}

      - name: Create GitHub Release for tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.apk-path }}
            ${{ steps.build.outputs.manifest-path }}
