[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "esper-server"
path = "src/main.rs"

[dependencies]
rules = { path = "../rules" }
axum = "=0.8.9"
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
