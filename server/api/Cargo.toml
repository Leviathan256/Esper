[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "esper-server"
path = "src/main.rs"

[dependencies]
rules = { path = "../rules" }
axum = { version = "=0.8.9", features = ["ws"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "json"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter"] }
webauthn-rs = { version = "=0.6.2", features = ["conditional-ui"] }
tower_governor = { version = "=0.8.0", default-features = false, features = ["axum"] }
sha2 = "=0.11.1"
base64 = "=0.22.1"
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
governor = "=0.10.4"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = "=0.29.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
tokio = { version = "=1.54.1", features = ["test-util"] }
