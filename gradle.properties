org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Reuse task outputs across builds. On CI the cache is restored by setup-gradle,
# which is where most of the build-time saving comes from.
org.gradle.caching=true

# Run the Kotlin compiler inside the Gradle daemon instead of forking a separate
# Kotlin daemon, saving that JVM's startup on every build.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.nonTransitiveRClass=true
